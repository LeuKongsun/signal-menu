<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="aba-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003554"/>
      <stop offset="100%" stop-color="#002137"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="480" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Header Bar: KHQR / ABA Header -->
  <rect width="400" height="88" rx="24" fill="#E1251B"/>
  <rect y="64" width="400" height="24" fill="#E1251B"/>

  <!-- KHQR Badge -->
  <text x="200" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" text-anchor="middle" letter-spacing="3">
    KHQR
  </text>
  <text x="200" y="74" fill="#ffebee" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" text-anchor="middle" letter-spacing="1">
    BAKONG / ABA PAY
  </text>

  <!-- Store Name -->
  <text x="200" y="125" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="19" text-anchor="middle">
    SIGNAL CAFE &amp; DRINKS
  </text>
  <text x="200" y="145" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12" text-anchor="middle">
    Scan to Pay with ABA or any Banking App
  </text>

  <!-- QR Frame Outer -->
  <rect x="75" y="165" width="250" height="250" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Stylized QR Corner Targets -->
  <!-- Top Left Target -->
  <rect x="95" y="185" width="56" height="56" rx="8" fill="#003554"/>
  <rect x="105" y="195" width="36" height="36" rx="4" fill="#F8FAFC"/>
  <rect x="113" y="203" width="20" height="20" rx="3" fill="#003554"/>

  <!-- Top Right Target -->
  <rect x="249" y="185" width="56" height="56" rx="8" fill="#003554"/>
  <rect x="259" y="195" width="36" height="36" rx="4" fill="#F8FAFC"/>
  <rect x="267" y="203" width="20" height="20" rx="3" fill="#003554"/>

  <!-- Bottom Left Target -->
  <rect x="95" y="339" width="56" height="56" rx="8" fill="#003554"/>
  <rect x="105" y="349" width="36" height="36" rx="4" fill="#F8FAFC"/>
  <rect x="113" y="357" width="20" height="20" rx="3" fill="#003554"/>

  <!-- Decorative QR Data Matrix Blocks -->
  <rect x="170" y="188" width="12" height="22" rx="2" fill="#003554"/>
  <rect x="190" y="195" width="18" height="12" rx="2" fill="#003554"/>
  <rect x="218" y="188" width="14" height="14" rx="2" fill="#003554"/>
  
  <rect x="165" y="222" width="16" height="16" rx="2" fill="#003554"/>
  <rect x="192" y="218" width="24" height="12" rx="2" fill="#003554"/>
  <rect x="228" y="215" width="12" height="26" rx="2" fill="#003554"/>

  <!-- Center Logo Circle -->
  <circle cx="200" cy="290" r="26" fill="#8E583C" stroke="#ffffff" stroke-width="3"/>
  <path d="M192 286 C 192 296, 208 296, 208 286 Z M190 285 L 210 285" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M210 287 C 213 287, 214 290, 212 292 L 210 293" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Bottom Data Blocks -->
  <rect x="165" y="330" width="14" height="24" rx="2" fill="#003554"/>
  <rect x="190" y="340" width="22" height="14" rx="2" fill="#003554"/>
  <rect x="222" y="325" width="16" height="18" rx="2" fill="#003554"/>
  <rect x="250" y="330" width="24" height="14" rx="2" fill="#003554"/>
  <rect x="284" y="340" width="16" height="24" rx="2" fill="#003554"/>
  <rect x="170" y="365" width="28" height="16" rx="2" fill="#003554"/>
  <rect x="210" y="360" width="18" height="24" rx="2" fill="#003554"/>
  <rect x="240" y="362" width="14" height="14" rx="2" fill="#003554"/>

  <!-- Footer Info -->
  <text x="200" y="445" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" text-anchor="middle">
    ABA KHQR • Scan &amp; Upload Receipt
  </text>
  <text x="200" y="462" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="10" text-anchor="middle">
    Replace public/aba-qr.png with your real ABA QR anytime
  </text>
</svg>
